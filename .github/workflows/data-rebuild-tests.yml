name: NBA data rebuild tooling tests
on:
  pull_request:
    paths:
      - "scripts/data_rebuild/**"
      - "tests/test_data_rebuild.py"
      - ".github/workflows/data-rebuild-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax-check rebuild tools
        run: python -m compileall -q scripts/data_rebuild tests/test_data_rebuild.py
      - name: Unit tests with synthetic panels/archives
        run: python -m unittest discover -s tests -p test_data_rebuild.py -v
      - name: Frozen panel self-check
        run: |
          python scripts/data_rebuild/compare_panels.py \
            --reference data_intermediate/player_team_game_harmonized_cadence.csv.gz \
            --candidate data_intermediate/player_team_game_harmonized_cadence.csv.gz
      - name: Validate real published game-source lineage (7,230 games)
        run: |
          git clone --depth 1 https://github.com/OEKundakcioglu/nba-ppp-star-availability.git "$RUNNER_TEMP/nba_shared"
          python scripts/data_rebuild/build_source_lineage.py \
            --source "$RUNNER_TEMP/nba_shared/provenance/historical_sources"
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("data_rebuild/output/game_source_lineage.csv")
          with path.open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 7230
          assert len(set(r["game_id"] for r in rows)) == 7230
          assert len(set(r["nba_game_id"] for r in rows)) == 7230
          print("PASS: 7,230 unique report-to-boxscore game joins")
          PY
