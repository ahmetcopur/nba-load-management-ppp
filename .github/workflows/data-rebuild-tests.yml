name: NBA data rebuild tooling tests
on:
  pull_request:
    paths:
      - "scripts/data_rebuild/**"
      - "tests/test_data_rebuild.py"
      - "tests/test_level_b_replay.py"
      - "tests/test_boxscore_cache.py"
      - "tests/test_fixture_date_swap_covariates.py"
      - "requirements-boxscore-lock.txt"
      - "requirements-builder-lock.txt"
      - ".github/workflows/data-rebuild-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Syntax-check rebuild tools
        run: python -m compileall -q scripts/data_rebuild tests/test_data_rebuild.py
      - name: Unit tests with synthetic panels/archives
        run: python -m unittest discover -s tests -p test_data_rebuild.py -v
      - name: Validate frozen panel scientific invariants
        run: python scripts/data_rebuild/validate_cadence_panel.py --expect-frozen
      - name: CSV comparator smoke test (same-file identity only)
        run: |
          python scripts/data_rebuild/compare_panels.py \
            --reference data_intermediate/player_team_game_harmonized_cadence.csv.gz \
            --candidate data_intermediate/player_team_game_harmonized_cadence.csv.gz
      - name: Validate real published game-source lineage (7,230 games)
        run: |
          git init "$RUNNER_TEMP/nba_shared"
          git -C "$RUNNER_TEMP/nba_shared" remote add origin https://github.com/OEKundakcioglu/nba-ppp-star-availability.git
          git -C "$RUNNER_TEMP/nba_shared" fetch --depth 1 origin 0bd713d97e8d519df5700ef473da34aba4495223
          git -C "$RUNNER_TEMP/nba_shared" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nba_shared" rev-parse HEAD)" = "0bd713d97e8d519df5700ef473da34aba4495223"
          python scripts/data_rebuild/build_source_lineage.py \
            --source "$RUNNER_TEMP/nba_shared/provenance/historical_sources"
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("data_rebuild/output/game_source_lineage.csv")
          with path.open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 7230
          assert len(set(r["game_id"] for r in rows)) == 7230
          assert len(set(r["nba_game_id"] for r in rows)) == 7230
          print("PASS: 7,230 unique report-to-boxscore game joins")
          PY
      - name: Check actual archived analysis package members
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.data_rebuild.restore_historical_layout import resolve_member
          for archive, basename in (
              ("packages/01_analysis_ready_panel.zip", "player_game_panel_analysis_ready.csv.gz"),
              ("packages/06_cadence_harmonized_identification.zip", "player_team_game_harmonized_cadence.csv.gz"),
              ("packages/06_cadence_harmonized_identification.zip", "cadence_harmonized_model_results.csv"),
          ):
              with ZipFile(archive) as z:
                  member = resolve_member(z, basename)
                  print(f"PASS {archive} -> {member} ({z.getinfo(member).file_size} bytes)")
          PY
      - name: Validate historical Stage-6 result archive schema
        run: |
          python - <<'PY'
          from scripts.data_rebuild.compare_stage6_models import archived_rows, index, EXPECTED
          rows = archived_rows(__import__("pathlib").Path(
              "packages/06_cadence_harmonized_identification.zip"))
          found = index(rows)
          assert set(found) == EXPECTED, f"Unexpected published model variants: {set(found)}"
          print("PASS: four archived Stage-6 TV/control model specifications")
          PY
  builder-tooling-tests:
    name: Historical pandas-2 builder / exact-clock unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verified historical builder environment
        run: python -m pip install -r requirements-builder-lock.txt
      - name: Confirm builder version and syntax
        run: |
          python - <<'PY'
          import pandas, fitz
          assert pandas.__version__.startswith('2.'), pandas.__version__
          print('pandas:', pandas.__version__, 'PyMuPDF:', fitz.VersionBind)
          PY
          python -m compileall -q scripts/data_rebuild tests
      - name: Test original risk-set guard, archive fallback, and PDF timing logic
        run: python -m unittest discover -s tests -p test_level_b_replay.py -v
  boxscore-json-tests:
    name: Level-C raw JSON verifier fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned offline boxscore analysis dependencies
        run: python -m pip install -r requirements-boxscore-lock.txt
      - name: Check verifier syntax
        run: python -m compileall -q scripts/data_rebuild/verify_boxscore_cache.py scripts/data_rebuild/audit_fixture_date_swap_covariates.py scripts/data_rebuild/run_fixture_date_control_sensitivity.py tests/test_boxscore_cache.py tests/test_fixture_date_swap_covariates.py
      - name: Run negative JSON / roster join / reference comparison tests
        run: python -m unittest discover -s tests -p test_boxscore_cache.py -v
      - name: Run original-covariate date-swap fixture tests
        run: python -m unittest discover -s tests -p test_fixture_date_swap_covariates.py -v
  stage6-regression-replay:
    name: Independent Stage-6 model replay from published frozen data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact historical analysis dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run original Stage-6 regression executable on frozen panel
        run: |
          python scripts/data_rebuild/replay_stage6_from_frozen.py --timeout 1080
      - name: Upload regression verification (not raw NBA data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-frozen-panel-replay
          path: data_rebuild/output/stage6_replay/
          if-no-files-found: warn
