name: NBA data rebuild tooling tests
on:
  pull_request:
    paths:
      - "scripts/data_rebuild/**"
      - "tests/test_data_rebuild.py"
      - ".github/workflows/data-rebuild-tests.yml"
      - "documentation/REPRODUCIBILITY_AUDIT_2026-11.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tooling-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax-check reconstruction tools
        run: python -m compileall -q scripts/data_rebuild tests/test_data_rebuild.py
      - name: Unit tests using synthetic panels and archives
        run: python -m unittest discover -s tests -p test_data_rebuild.py -v
      - name: Frozen panel invariant check (does not rebuild)
        run: |
          python scripts/data_rebuild/verify_cadence_panel.py \
            --candidate data_intermediate/player_team_game_harmonized_cadence.csv.gz
      - name: Comparator smoke test (reference against itself, not replication)
        run: |
          python scripts/data_rebuild/compare_panels.py \
            --reference data_intermediate/player_team_game_harmonized_cadence.csv.gz \
            --candidate data_intermediate/player_team_game_harmonized_cadence.csv.gz
      - name: Checkout pinned public source metadata
        uses: actions/checkout@v4
        with:
          repository: OEKundakcioglu/nba-ppp-star-availability
          ref: 0bd713d97e8d519df5700ef473da34aba4495223
          path: _shared
          sparse-checkout: |
            provenance/historical_sources
      - name: Verify real 7,230-game report/boxscore metadata linkage
        run: |
          python scripts/data_rebuild/build_source_lineage.py \
            --source _shared/provenance/historical_sources
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("data_rebuild/output/game_source_lineage.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 7230
          assert len({r["game_id"] for r in rows}) == 7230
          assert len({r["nba_game_id"] for r in rows}) == 7230
          print("PASS: unique 7,230-game source lineage from pinned public metadata")
          PY
